<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Yeni Kitap Ekle</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header>
    <nav>
      <a href="index.html">Ana Sayfa (Katalog)</a>
      <a href="form.html" class="active">Yeni Kitap Ekle</a>
      <a href="table.html">Kitap Tablosu</a>
    </nav>
  </header>

  <main class="container">
    <h1>Yeni Kitap Ekle</h1>
    <p class="description">Kitap bilgilerini doldurarak kataloğa ekleyebilirsin.</p>

    <form id="bookForm">
      <div class="form-group">
        <label for="title">Kitap adı</label>
        <input id="title" name="title" type="text" required>
      </div>

      <div class="form-group">
        <label for="author">Yazar</label>
        <input id="author" name="author" type="text" required>
      </div>

      <div class="form-group">
        <label for="year">Yayın yılı</label>
        <input id="year" name="year" type="number" min="1" required>
      </div>

      <div class="form-group">
        <label for="genre">Kategori</label>
        <select id="genre" name="genre" required>
          <option value="">Kategori seç</option>
          <option value="Dystopian">Dystopian</option>
          <option value="Felsefe">Felsefe</option>
          <option value="Roman">Roman</option>
          <option value="Bilim Kurgu">Bilim Kurgu</option>
        </select>
      </div>

      <div class="form-group">
        <label for="pageCount">Sayfa sayısı</label>
        <input id="pageCount" name="pageCount" type="number" min="1" required>
      </div>

      <div class="form-group">
        <label for="status">Okuma durumu</label>
        <select id="status" name="status" required>
          <option value="Okunmadı">Okunmadı</option>
          <option value="Okunuyor">Okunuyor</option>
          <option value="Okundu">Okundu</option>
        </select>
      </div>

      <div class="form-group full-width">
        <label for="description">Açıklama</label>
        <textarea id="description" name="description" rows="4"></textarea>
      </div>

      <div class="form-group full-width">
        <label for="coverImage">Kapak görseli URL’si (isteğe bağlı)</label>
        <input id="coverImage" name="coverImage" type="url">
      </div>

      <button type="submit">Kitabı Ekle</button>
    </form>

    <p id="message" role="status"></p>
  </main>

  <script src="js/data.js"></script>
  <script src="js/form.js"></script>
</body>
</html>
